name: Load test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}

jobs:
  locust:
    name: Locust against staging (30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }

      - run: pip install locust

      - name: Verify staging host
        run: |
          set -euo pipefail
          if [ -z "$STAGING_HOST" ]; then
            echo "::error::Set the STAGING_HOST repository variable to the reachable staging API origin."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 "$STAGING_HOST/health" > /dev/null

      - name: Run Locust
        run: |
          locust -f scripts/locustfile.py \
            --host="${{ env.STAGING_HOST }}" \
            --users=200 --spawn-rate=20 --run-time=30m --headless \
            --exit-code-on-error 1 \
            --csv=load --html=load-report.html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: load-test, path: 'load*', retention-days: 30 }

      - name: Check health latency target
        id: compare
        run: |
          set -euo pipefail
          # The former generation/session rows did not exist: no Locust file
          # was present. This is an explicit health SLA, not a measured baseline.
          P95_HEALTH_SLA_MS=500
          P95=$(python - <<'PY'
          import csv
          with open('load_stats.csv', newline='', encoding='utf-8') as report:
              rows = csv.DictReader(report)
              health = next((row for row in rows if row['Name'] == '/health'), None)
          print(health['95%'] if health else '')
          PY
          )
          if ! [[ "$P95" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::No numeric /health p95 in Locust report"
            exit 1
          fi
          echo "Health p95 (load): ${P95}ms; SLA: ${P95_HEALTH_SLA_MS}ms"
          if awk -v p95="$P95" -v target="$P95_HEALTH_SLA_MS" 'BEGIN { exit !(p95 > target) }'; then
            echo "REGRESSION_DETECTED=true" >> $GITHUB_ENV
            exit 1
          fi

      - name: Open issue on regression
        if: always() && env.REGRESSION_DETECTED == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[perf] weekly health load test exceeded its p95 SLA on ${new Date().toISOString().slice(0,10)}`,
              labels: ['perf', 'regression'],
              body: `Weekly Locust against staging exceeded the 500ms p95 health target. See workflow run: ${context.runId}`
            });
