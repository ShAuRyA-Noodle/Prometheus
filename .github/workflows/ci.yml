name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-quality:
    name: Backend quality (Ruff + mypy ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Pin quality tools
        run: pip install ruff==0.16.9 mypy==1.14.1
      - name: Check backend quality against documented baseline
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/quality_backend.py --base "$QUALITY_BASE_REF"

  test-backend:
    name: Test backend (coverage floor 61.5%, target 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest with coverage and no-regression gate
        env:
          ENV: dev
          VERTEX_SAFETY_ENABLED: "false"
          PYTHONUNBUFFERED: "1"
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cd backend
          pytest --cov=. --cov-branch --cov-report=xml --cov-report=term --cov-fail-under=0 -q
          coverage json -o coverage.json
          python ../scripts/check_backend_coverage.py --report coverage.json --base "$QUALITY_BASE_REF"
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
          retention-days: 7

  lint-frontend:
    name: Lint frontend (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run format:check

  typecheck-frontend:
    name: Typecheck and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build

  test-frontend:
    name: Test frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run test:ci

  audit-dependencies:
    name: Audit dependencies (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

  pre-commit-hooks:
    name: Pre-commit hooks (gitleaks + custom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No service-account.json paths
        run: |
          if grep -RIn "service-account.json" backend/Dockerfile* infrastructure/ 2>/dev/null; then
            echo "Found service-account.json reference in Docker layer or infra"; exit 1
          fi
      - name: No raw HTML in agent outputs without nh3
        run: |
          if grep -RIn "html_raw\|return.*<\(script\|iframe\)" backend/agents/ 2>/dev/null; then
            echo "Found raw HTML in agent code"; exit 1
          fi
      - name: No idea_text in logs
        run: |
          if grep -RIn 'logger.*idea_text[^_]' backend/ 2>/dev/null; then
            echo "Found idea_text in log statement (use idea_text_hash)"; exit 1
          fi

  prompt-registry-gate:
    name: Prompt registry gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify PROMPT_REGISTRY.md updated when prompts change
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PROMPT_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'backend/prompts/*' || true)
          REGISTRY_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'docs/PROMPT_REGISTRY.md' || true)
          if [[ -n "$PROMPT_CHANGED" && -z "$REGISTRY_CHANGED" ]]; then
            echo "Prompt files changed but docs/PROMPT_REGISTRY.md was not updated."
            echo "Changed prompts:"; echo "$PROMPT_CHANGED"
            exit 1
          fi

  architecture-doc-gate:
    name: Architecture doc gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify ARCHITECTURE.md updated when topology changes
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          TOPO_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'backend/agents/orchestrator.py' 'backend/agents/gates.py' 'backend/api/' || true)
          DOC_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'docs/ARCHITECTURE.md' || true)
          if [[ -n "$TOPO_CHANGED" && -z "$DOC_CHANGED" ]]; then
            echo "Topology files changed but docs/ARCHITECTURE.md was not updated."
            echo "Changed topology files:"; echo "$TOPO_CHANGED"
            exit 1
          fi
